name: validate
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libxml2
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Validate phrase presets (.xrnz = plain XML)
        run: |
          set -e
          err=0
          while IFS= read -r f; do
            xmllint --noout "$f" || err=1
          done < <(find Phrases -name '*.xrnz')
          exit $err
      - name: Validate instruments (.xrni = zip w/ Instrument.xml)
        run: |
          set -e
          err=0
          while IFS= read -r f; do
            d=$(mktemp -d)
            unzip -q -o "$f" Instrument.xml -d "$d" 2>/dev/null || { err=1; rm -rf "$d"; continue; }
            xmllint --noout "$d/Instrument.xml" || err=1
            rm -rf "$d"
          done < <(find Instruments -name '*.xrni')
          exit $err
